<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>Nertz Royale — Fast-Play Solitaire Racing</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
</head>
<body>
  <div id="app">
    <!-- ===================== TOP BAR ===================== -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">♠♥</span>
        <span class="brand-name">Nertz<span class="brand-accent">Royale</span></span>
      </div>
      <div class="topbar-right">
        <div class="lvl-chip" id="lvlChip" title="Your level &amp; XP">
          <span class="lvl-badge" id="lvlBadge">1</span>
          <div class="lvl-meta">
            <div class="lvl-bar"><span id="lvlBarFill"></span></div>
            <span class="lvl-coins" id="coins">0 ◈</span>
          </div>
        </div>
        <button class="icon-btn" id="navStats" title="Stats &amp; achievements">📊</button>
        <button class="icon-btn" id="navBoard" title="Leaderboard">🏆</button>
        <button class="icon-btn" id="navSettings" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- ===================== HOME / MENU ===================== -->
    <main class="screen screen--menu active" id="screenMenu">
      <div class="hero">
        <h1 class="hero-title">Race to empty your <span>Nertz</span> pile.</h1>
        <p class="hero-sub">The classic fast-play solitaire race — rebuilt, then improved in every way.</p>
      </div>

      <section class="mode-grid">
        <button class="mode-card mode-card--primary" data-mode="fast">
          <span class="mode-emoji">⚡</span>
          <span class="mode-title">Fast Play</span>
          <span class="mode-desc">Jump straight in. One quick round vs the bots.</span>
        </button>
        <button class="mode-card" data-mode="ranked">
          <span class="mode-emoji">🏁</span>
          <span class="mode-title">Ranked Race</span>
          <span class="mode-desc">Earn XP, climb levels, chase the leaderboard.</span>
        </button>
        <button class="mode-card" data-mode="daily">
          <span class="mode-emoji">📅</span>
          <span class="mode-title">Daily Challenge</span>
          <span class="mode-desc">Everyone gets the same shuffle. One shot a day.</span>
        </button>
        <button class="mode-card" data-mode="zen">
          <span class="mode-emoji">🌙</span>
          <span class="mode-title">Zen Solo</span>
          <span class="mode-desc">No bots, no clock. Just you and the cards.</span>
        </button>
      </section>

      <div class="menu-config" id="menuConfig">
        <div class="cfg-row">
          <span class="cfg-label">Opponents</span>
          <div class="seg" id="cfgOpponents" data-val="2">
            <button data-v="1">1</button><button data-v="2" class="on">2</button><button data-v="3">3</button>
          </div>
        </div>
        <div class="cfg-row">
          <span class="cfg-label">Difficulty</span>
          <div class="seg" id="cfgDifficulty" data-val="normal">
            <button data-v="easy">Rookie</button><button data-v="normal" class="on">Sharp</button><button data-v="hard">Ace</button>
          </div>
        </div>
      </div>
    </main>

    <!-- ===================== GAME ===================== -->
    <main class="screen screen--game" id="screenGame">
      <div class="game-hud">
        <button class="icon-btn ghost" id="btnQuit" title="Back to menu">‹</button>
        <div class="hud-stat"><span class="hud-k">Score</span><span class="hud-v" id="hudScore">0</span></div>
        <div class="hud-stat"><span class="hud-k">Nertz left</span><span class="hud-v" id="hudNertz">13</span></div>
        <div class="hud-stat"><span class="hud-k">Time</span><span class="hud-v" id="hudTime">0:00</span></div>
        <div class="hud-spacer"></div>
        <button class="icon-btn ghost" id="btnAuto" title="Auto-play to foundations (A)">⤴</button>
        <button class="icon-btn ghost" id="btnRestart" title="New deal (R)">↻</button>
        <button class="icon-btn ghost" id="btnHint" title="Hint (H)">💡</button>
      </div>

      <!-- Opponents strip -->
      <div class="opp-strip" id="oppStrip"></div>

      <!-- Shared foundations -->
      <div class="foundations" id="foundations"></div>

      <!-- Player's board -->
      <div class="player-board">
        <div class="board-left">
          <div class="pile-slot" id="nertzSlot" data-zone="nertz">
            <div class="pile-label">Nertz</div>
          </div>
          <div class="stock-row">
            <div class="pile-slot stock" id="stockSlot" data-zone="stock">
              <div class="pile-label">Stock</div>
            </div>
            <div class="pile-slot waste" id="wasteSlot" data-zone="waste">
              <div class="pile-label">Waste</div>
            </div>
          </div>
        </div>
        <div class="work-row" id="workRow"></div>
      </div>
    </main>

    <!-- ===================== OVERLAYS ===================== -->
    <div class="overlay" id="overlayRound">
      <div class="sheet result-sheet">
        <div class="result-emoji" id="resultEmoji">🎉</div>
        <h2 class="result-title" id="resultTitle">Round over</h2>
        <div class="result-table" id="resultTable"></div>
        <div class="reward-row" id="rewardRow"></div>
        <div class="sheet-actions">
          <button class="btn btn-ghost" id="resultMenu">Menu</button>
          <button class="btn btn-primary" id="resultAgain">Play again</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="overlayPanel">
      <div class="sheet panel-sheet">
        <button class="sheet-close" id="panelClose">✕</button>
        <div class="panel-tabs">
          <button class="ptab on" data-tab="stats">Stats</button>
          <button class="ptab" data-tab="ach">Achievements</button>
          <button class="ptab" data-tab="board">Leaderboard</button>
          <button class="ptab" data-tab="settings">Settings</button>
        </div>
        <div class="panel-body" id="panelBody"></div>
      </div>
    </div>

    <div class="toast-host" id="toastHost"></div>
    <div class="fx-layer" id="fxLayer"></div>
  </div>

  <script src="js/deck.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
